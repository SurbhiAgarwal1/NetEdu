# ---------------------------------------------------------------------------
# NetEdu - docker-compose.yml
# Runs: PostgreSQL + Django Backend + React Frontend + Nginx reverse proxy
# Usage:  docker compose up --build
# ---------------------------------------------------------------------------

services:

  # 1. Database
  db:
    image: postgres:16-alpine
    container_name: netedu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netedu}
      POSTGRES_USER: ${POSTGRES_USER:-netedu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netedu_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netedu_user} -d ${POSTGRES_DB:-netedu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netedu_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-netedu_user}:${POSTGRES_PASSWORD:-netedu_pass}@db:5432/${POSTGRES_DB:-netedu}
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations --noinput && python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # 3. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: netedu_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # 4. Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: netedu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/staticfiles:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_files:
